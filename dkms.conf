PACKAGE_NAME="@PKGNAME@"
PACKAGE_VERSION="@PKGVER@"
MAKE[0]="if grep -qsw CONFIG_CC_IS_CLANG=y $kernel_source_dir/include/config/auto.conf; then llvm=LLVM=1; fi; make -C $kernel_source_dir M=$dkms_tree/$module/$module_version/build/src $llvm modules"
BUILT_MODULE_NAME[0]="@PKGNAME@"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
