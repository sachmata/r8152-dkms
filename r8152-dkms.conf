# Blacklist in-kernel drivers that compete with the out-of-tree r8152 module
# for Realtek USB NIC devices. The out-of-tree r8152 module installs to
# /updates/ and wins via depmod ordering, so it must NOT be blacklisted
# itself — only the competing drivers that would claim the device first.
blacklist r8153_ecm
blacklist cdc_ncm
